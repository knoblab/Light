[workspace]
resolver = "2"
members = [
    "crates/sc-core",
    "crates/sc-imgproc",
    "crates/sc-color",
    "crates/sc-tiff",
    "crates/sc-raw",
    "crates/sc-detect",
    "crates/sc-decode",
    "crates/sc-session",
    "crates/sc-heal",
    "crates/sc-dng",
    "crates/sc-server",
    "crates/sc-cli",
    "crates/sc-wasm",
    "crates/sc-tauri",
    "crates/sc-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
png = "0.17"
jpeg-encoder = "0.6"
memmap2 = "0.9"
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
proptest = "1.5"
tempfile = "3.13"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"

