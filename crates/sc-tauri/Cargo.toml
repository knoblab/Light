[package]
name = "sc-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sc_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sc-core = { path = "../sc-core" }
sc-session = { path = "../sc-session" }
sc-decode = { path = "../sc-decode" }
sc-detect = { path = "../sc-detect" }
sc-heal = { path = "../sc-heal" }
sc-dng = { path = "../sc-dng" }
sc-color = { path = "../sc-color" }

tauri = { version = "2.2", default-features = false, features = ["wry"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", default-features = false , features = [] }
